services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: concierge
      POSTGRES_PASSWORD: concierge
      POSTGRES_DB: concierge
    ports:
      - '127.0.0.1:7432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U concierge -d concierge']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:  /root/Naila-Arts/.env.chatapp
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://concierge:concierge@db:5432/concierge
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '127.0.0.1:7080:80'
    depends_on:
      - api

volumes:
  pgdata:
